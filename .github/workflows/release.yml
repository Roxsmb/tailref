name: Build artifacts (manual)

# This workflow NEVER publishes a release.
# It builds the Windows artifacts and uploads them as workflow artifacts so a
# maintainer can inspect and attach them to a GitHub Release by hand.
#
# See docs/RELEASE.md for the release checklist.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        options:
          - portable
          - setup
          - both
        default: portable

permissions:
  contents: read

jobs:
  build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build renderer bundle
        run: node scripts/build-app.js

      - name: Pure gate chain
        run: node scripts/run-gates.js

      - name: Build portable
        if: ${{ inputs.target == 'portable' || inputs.target == 'both' }}
        run: npm run build:portable

      - name: Build installer
        if: ${{ inputs.target == 'setup' || inputs.target == 'both' }}
        run: npm run build:setup

      - name: Verify packaged app.asar
        run: npm run test:package

      - name: Write checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tailref-windows
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: Reminder
        shell: bash
        run: |
          echo "Artifacts uploaded. This workflow did not create or publish a release."
          echo "Follow docs/RELEASE.md to create the GitHub Release manually."
