name: CI

# Pull requests and pushes to main run the pure gates on Windows and Linux,
# then build and validate the Linux packages so packaging regressions are
# caught before a release tag exists. Nothing is published from this workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  gates:
    name: Gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Rebuild renderer bundle
        run: node scripts/build-app.js

      - name: Verify bundle is reproducible
        shell: bash
        run: |
          if [ -n "$(git status --porcelain src/renderer/app.js)" ]; then
            echo "src/renderer/app.js is out of date. Run: node scripts/build-app.js"
            git --no-pager diff --stat src/renderer/app.js
            exit 1
          fi

      - name: Pure gate chain
        run: node scripts/run-gates.js

      - name: Production dependency audit
        run: npm audit --omit=dev

  linux-package:
    name: Build and smoke-test Linux packages
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 make rpm xvfb xauth libfuse2 libglib2.0-bin \
            libgtk-3-0 libnss3 libasound2 libgbm1 libatk-bridge2.0-0 \
            libxss1 libxtst6 xdg-utils

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build renderer bundle
        run: node scripts/build-app.js

      - name: Build the native inkcore module
        run: node scripts/build-native.js

      - name: Build AppImage, deb and rpm
        run: npx electron-builder --linux AppImage deb rpm --publish never

      - name: Verify packaged app
        run: node scripts/verify-package.js dist/linux-unpacked

      - name: Reject Windows binaries in the Linux payload
        shell: bash
        run: |
          set -euo pipefail
          leaked="$(find dist/linux-unpacked -type f \
            \( -name '*.exe' -o -name '*.dll' -o -name '*.ico' \) || true)"
          if [ -n "$leaked" ]; then
            echo "Windows binaries found in the Linux package:" >&2
            echo "$leaked" >&2
            exit 1
          fi
          echo "Linux payload contains no Windows binaries."

      - name: Inspect package contents
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          DEB="dist/tailref_${VERSION}_amd64.deb"
          RPM="dist/tailref-${VERSION}.x86_64.rpm"
          APPIMAGE="dist/TailRef-${VERSION}.AppImage"
          test -f "$DEB" && test -f "$RPM" && test -f "$APPIMAGE"
          DEB_LIST="$(dpkg-deb -c "$DEB")"
          RPM_LIST="$(rpm -qlp "$RPM")"
          grep -q 'usr/share/mime/packages/tailref\.xml' <<< "$DEB_LIST"
          grep -q 'usr/share/applications/tailref\.desktop' <<< "$DEB_LIST"
          if grep -qE '\.(exe|dll|ico)$' <<< "$DEB_LIST"; then
            echo "Windows files leaked into the deb" >&2
            exit 1
          fi
          grep -q 'usr/share/mime/packages/tailref\.xml' <<< "$RPM_LIST"
          if grep -qE '\.(exe|dll|ico)$' <<< "$RPM_LIST"; then
            echo "Windows files leaked into the rpm" >&2
            exit 1
          fi
          rm -rf squashfs-root
          "$APPIMAGE" --appimage-extract >/dev/null
          test -f squashfs-root/usr/share/mime/packages/tailref.xml
          desktop="$(find squashfs-root -maxdepth 1 -name '*.desktop' | sed -n '1p')"
          grep -q '^MimeType=application/x-tailref-board;$' "$desktop"
          rm -rf squashfs-root

      - name: Install the deb and verify the .tail association
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          sudo apt-get install -y "./dist/tailref_${VERSION}_amd64.deb"
          test -f /usr/share/mime/packages/tailref.xml
          grep -q '<glob pattern="\*\.tail"/>' /usr/share/mime/packages/tailref.xml
          grep -rl 'MimeType=application/x-tailref-board' /usr/share/applications/ | sed -n '1p'
          printf '{"probe":true}' > /tmp/tailref-association-probe.tail
          gio_type="$(gio info -a standard::content-type /tmp/tailref-association-probe.tail \
            | sed -n 's/^[[:space:]]*standard::content-type:[[:space:]]*//p')"
          echo "gio content type: $gio_type"
          test "$gio_type" = "application/x-tailref-board"
          sudo apt-get remove -y tailref
          test ! -f /usr/share/mime/packages/tailref.xml

      - name: Smoke-launch the AppImage under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          APPIMAGE="dist/TailRef-${VERSION}.AppImage"
          chmod +x "$APPIMAGE"
          set +e
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            timeout 25s "$APPIMAGE" --appimage-extract-and-run --no-sandbox --disable-gpu \
            > /tmp/tailref-appimage.log 2>&1
          code=$?
          set -e
          cat /tmp/tailref-appimage.log
          if [ "$code" -ne 124 ]; then
            echo "AppImage exited before the timeout (exit $code)" >&2
            exit 1
          fi
          echo "AppImage stayed alive for 25s."

      - name: Upload Linux packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-ci
          if-no-files-found: ignore
          retention-days: 7
          path: |
            dist/TailRef-*.AppImage
            dist/tailref_*.deb
            dist/tailref-*.rpm
