name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: Gates (Node + static checks)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Rebuild renderer bundle
        run: node scripts/build-app.js

      - name: Verify bundle is reproducible
        shell: bash
        run: |
          if [ -n "$(git status --porcelain src/renderer/app.js)" ]; then
            echo "src/renderer/app.js is out of date. Run: node scripts/build-app.js"
            git --no-pager diff --stat src/renderer/app.js
            exit 1
          fi

      - name: Pure gate chain
        run: node scripts/run-gates.js

      - name: Dependency advisories (informational)
        run: npm audit --omit=dev
        continue-on-error: true
