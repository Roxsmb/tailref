<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<style>
/* Uygulama yazı tipi: Inter Variable (SIL OFL 1.1) — değişken wght 100-900. */
@font-face{
  font-family:'Inter';font-style:normal;font-weight:100 900;font-stretch:100%;font-display:swap;
  src:url('assets/fonts/InterVariable.woff2') format('woff2-variations');
}
@font-face{
  font-family:'Inter';font-style:italic;font-weight:100 900;font-stretch:100%;font-display:swap;
  src:url('assets/fonts/InterVariable-Italic.woff2') format('woff2-variations');
}
:root{--splash-ease:cubic-bezier(.16,1,.3,1);--splash-ink:#8fc6e4;--splash-dim:#5f87a0}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060608;color:#f4f8fc;font-family:'Inter',BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
body{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;isolation:isolate}
body::before{
  content:"";position:absolute;inset:-18%;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.05),rgba(255,255,255,0) 58%);
  opacity:0;transform:scale(.94);
  animation:splashGlow 1.8s var(--splash-ease) .12s both;
}

/* ---- Açılış işareti: beyaz kart içinde fırça-kuyruklu sincap logosu
   (bitmap, gömülü base64; build-brand-assets.py üretimi). ---- */
.splashMark{
  position:relative;z-index:1;
  width:280px;height:280px;
  opacity:0;transform:translateY(9px) scale(.965);
  animation:splashMark .8s var(--splash-ease) both;
  will-change:opacity,transform;
  border-radius:64px;
  background:#fafaf8;
  box-shadow:0 18px 60px rgba(0,0,0,.5), 0 0 60px rgba(255,255,255,.06);
}
.splashMark img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}

.brand{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;line-height:1;
  opacity:0;transform:translateY(7px);
  animation:splashBrand .75s var(--splash-ease) .16s both;
}
.brand{font-family:'Inter','Segoe UI',system-ui,sans-serif;font-style:italic}
/* Kelime işareti: bitmap PNG — beyaz, şeffaf zemin (kullanıcının wordmark dosyası;
   şeffaf kenarlar kırpılıp 686×240'a indirildi). Metin gölgesinin yerine yumuşak ışıma. */
.brand .wordmark{
  display:block;
  height:52px;
  width:auto;
  filter:drop-shadow(0 0 22px rgba(255,255,255,.38));
  user-select:none;-webkit-user-drag:none;
}
/* Etiket: STUDIO ile aynı stil */
.brand .tag{
  font-style:normal;font-size:10px;font-weight:600;line-height:1.2;
  letter-spacing:.12em;margin-top:10px;text-align:center;
  color:#a8a8ad;opacity:.55;
}
@keyframes splashMark{from{opacity:0;transform:translateY(9px) scale(.965)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes splashBrand{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes splashGlow{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){
  body::before,.splashMark,.brand{animation:none!important;opacity:1!important;transform:none!important}
}
</style></head><body>
